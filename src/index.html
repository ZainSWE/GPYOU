<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GPYOU — Find the perfect GPU for your needs, budget, and use case with AI-powered recommendations.">
    <title>GPYOU</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://secure-api-proxy.onrender.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link rel="preload" as="image" href="images/gpyou-animation/0001.png" fetchpriority="high">
    <link rel="preload" as="image" href="images/gpyou-animation/0002.png">
    <link rel="preload" as="image" href="images/gpyou-animation/0003.png">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Loaded here so model-viewer is ready when SPA navigates to Models page -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body class="cal-sans-regular" onload="bootServer()">

    <!-- ── Persistent: stays across all page swaps ── -->
    <canvas id="bg-canvas"></canvas>
    <div id="bg-loader">
        <div class="loader-bar">
            <div class="loader-fill" id="loader-fill"></div>
        </div>
        <p class="loader-label" id="loader-label">Loading · 0%</p>
    </div>

    <nav class="navbar">
        <ul>
            <li class="home"><a href="index.html" class="active">HOME</a></li>
            <li><a href="model.html">MODELS</a></li>
            <li><a href="about.html">ABOUT</a></li>
        </ul>
    </nav>

    <!-- ── Router swaps only what's inside here ── -->
    <div id="page-content">

        <div id="container">

            <!-- PAGE 1 — Hero + Questions -->
            <div id="page1" class="page visible">

                <div class="hero-section">
                    <div class="hero-left">
                        <p class="hero-eyebrow">GPU Recommendation Engine</p>
                        <h1 class="website-name">GPYOU</h1>
                        <p class="website-sub">Choose the perfect GPU just for you.</p>
                        <button class="scrollButton" onclick="document.getElementById('firstQuestion').scrollIntoView({ behavior: 'smooth', block: 'start' });">
                            GET STARTED
                        </button>
                    </div>
                </div>

                <div class="questions-section" id="firstQuestion"></div>

            </div>

            <!-- PAGE 2 — Results -->
            <div id="page2" class="page hidden">

                <div id="model">
                    <model-viewer
                        id="3dModel"
                        alt="A 3D model of a GPU"
                        auto-rotate
                        camera-controls
                        background-color="#455A64"
                    ></model-viewer>
                </div>

                <div class="glassPanel3"></div>

                <div class="info-wrap">
                    <div class="finalRec" id="finalRec"></div>
                    <div class="specs-row">
                        <div class="spec-card">
                            <div class="spec-info" id="specs"></div>
                        </div>
                    </div>
                </div>

                <footer>
                    <div class="footer-content">
                        <p>© GPYOU 2025. Choose the Perfect GPU just for you.</p>
                    </div>
                </footer>

            </div>

        </div>

    </div><!-- /#page-content -->

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <!-- Lenis -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>

    <!-- App scripts -->
    <script src="app.js" defer></script>
    <script src="questionsFlow.js" defer></script>
    <script src="bgCanvas.js" defer></script>
    <script src="galleryScript.js" defer></script>
    <script src="aboutScript.js" defer></script>
    <script src="animations.js" defer></script>
    <script src="router.js" defer></script>

</body>
</html>
